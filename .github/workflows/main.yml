name: Daily Crypto Scanner & Binance Trader

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 00:05 بتوقيت UTC بعد إغلاق الشمعة اليومية
    - cron: '5 0 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بأي وقت بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Daily Scan & Trade Management
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          python run_daily.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "CMACD-Bot"
          git config --global user.email "bot@github.com"
          git add bot_data.db
          git commit -m "Update active trades [skip ci]" || echo "No changes to commit"
          git push
